name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats bats-support bats-assert

      - name: Run tests
        run: bats -r tests/
